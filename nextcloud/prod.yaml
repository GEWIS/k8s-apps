apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-test
  namespace: flux-system
spec:
  interval: 1m
  path: "./nextcloud"
  prune: true
  sourceRef:
    kind: GitRepository
    name: nextcloud
  serviceAccountName: app-deployer
  targetNamespace: nextcloud-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud-test
