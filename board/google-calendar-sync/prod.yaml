apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: google-calendar-sync
  namespace: flux-system
spec:
  interval: 1m
  path: "./google-calendar-sync"
  prune: true
  sourceRef:
    kind: GitRepository
    name: google-calendar-sync
  serviceAccountName: app-deployer
  targetNamespace: board
