apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pwned-password-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./pwned-password/prod"
  prune: false # first adoption only, set to true after adoption
  sourceRef:
    kind: GitRepository
    name: pwned-password
  serviceAccountName: app-deployer
  targetNamespace: pwned-passwords-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: pwned-passwords-prod
