apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aurora-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./aurora/prod"
  prune: false # first adoption only, set to true after adoption
  sourceRef:
    kind: GitRepository
    name: aurora
  serviceAccountName: app-deployer
  targetNamespace: aurora-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: aurora-prod
