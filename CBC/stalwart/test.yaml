apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart-test
  namespace: flux-system
spec:
  interval: 1m
  path: "./stalwart"
  prune: true
  sourceRef:
    kind: GitRepository
    name: stalwart
  serviceAccountName: app-deployer
  targetNamespace: stalwart-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: stalwart-test
