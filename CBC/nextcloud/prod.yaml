apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./nextcloud/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: nextcloud
  serviceAccountName: app-deployer
  targetNamespace: nextcloud-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud-prod
