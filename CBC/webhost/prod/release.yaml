apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webhost-prod
  namespace: flux-system
spec:
  interval: 10m
  releaseName: prod
  targetNamespace: webhost-prod
  storageNamespace: webhost-prod
  serviceAccountName: app-deployer
  chart:
    spec:
      chart: static-webhost
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: gewis-webhost
        namespace: flux-system
  values:
    oidc:
      provider:
        clientId: webhost-prod
    domainGroups:
      - name: abc
        domains:
          - name: abc.gewis.nl
            writablePaths:
              - aoc_poster/cache
              - pr_poster/cache
        adminDomain: abc-admin.gewis.nl
        oidc:
          groups:
            - "WEBHOST - abc.gewis.nl"
      - name: gehack
        domains:
          - name: gehack.gewis.nl
        oidc:
          groups:
            - "WEBHOST - gehack.gewis.nl"
      - name: cbc-bbq
        domains:
          - name: cbc-bbq.gewis.nl
        oidc:
          groups: []
      - name: static
        domains:
          - name: static.gewis.nl
        oidc:
          groups:
            - "WEBHOST - static.gewis.nl"
      - name: stijl
        domains:
          - name: stijl.gewis.nl
        oidc:
          groups:
            - "WEBHOST - stijl.gewis.nl"
      - name: board
        domains:
          - name: vz.personal.gewis.nl
          - name: secr.personal.gewis.nl
          - name: pm.personal.gewis.nl
          - name: cib.personal.gewis.nl
          - name: co.personal.gewis.nl
          - name: ceb.personal.gewis.nl
        oidc:
          groups:
            - "WEBHOST - vz.personal.gewis.nl"
            - "WEBHOST - secr.personal.gewis.nl"
            - "WEBHOST - pm.personal.gewis.nl"
            - "WEBHOST - cib.personal.gewis.nl"
            - "WEBHOST - co.personal.gewis.nl"
            - "WEBHOST - ceb.personal.gewis.nl"
      - name: mta-sts
        domains:
          - name: mta-sts.gewis.nl
        oidc:
          groups:
            - "WEBHOST - mta-sts.gewis.nl"
      - name: 9eglinster
        domains:
          - name: 9eglinster.gewis.nl
        oidc:
          groups:
            - "WEBHOST - 9eglinster.gewis.nl"
      - name: athena
        domains:
          - name: athena.gewis.nl
        adminDomain: yourdomain.gewis.nl # ATHENA did not understand my email, so they went to yourdomain.gewis.nl/admin. This fix is here to make sure all is well.
        oidc:
          groups:
            - "WEBHOST - athena.gewis.nl"
      - name: defi
        domains:
          - name: defi.gewis.nl
        oidc:
          groups:
            - "WEBHOST - defi.gewis.nl"
      - name: avico
        domains:
          - name: avico.gewis.nl
        oidc:
          groups:
            - "WEBHOST - avico.gewis.nl"
      - name: boom
        domains:
          - name: boom.gewis.nl
        oidc:
          groups:
            - "WEBHOST - boom.gewis.nl"
      - name: gezwem
        domains:
          - name: gezwem.gewis.nl
        oidc:
          groups:
            - "WEBHOST - gezwem.gewis.nl"
      - name: intro
        domains:
          - name: intro.gewis.nl
        oidc:
          groups:
            - "WEBHOST - intro.gewis.nl"
      - name: odc
        domains:
          - name: odc.gewis.nl
        oidc:
          groups:
            - "WEBHOST - odc.gewis.nl"
      - name: ssg
        domains:
          - name: ssg.gewis.nl
        oidc:
          groups:
            - "WEBHOST - ssg.gewis.nl"
      - name: bac
        domains:
          - name: bac.gewis.nl
            writablePaths:
              - lucy-dr-graaf
        adminDomain: bac-admin.gewis.nl
        oidc:
          groups:
            - "WEBHOST - bac.gewis.nl"
      - name: rink-personal
        domains:
          - name: rink.personal.gewis.nl
            disabled: true
        oidc:
          groups:
            - "WEBHOST - rink.personal.gewis.nl"
      
    storage:
      size: 20Gi
---
apiVersion: v1
kind: Namespace
metadata:
  name: webhost-prod
