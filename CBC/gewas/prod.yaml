apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gewas-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./gewas"
  prune: true
  sourceRef:
    kind: GitRepository
    name: gewas
  serviceAccountName: app-deployer
  targetNamespace: gewas-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: gewas-prod
