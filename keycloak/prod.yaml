apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./keycloak"
  prune: true
  sourceRef:
    kind: GitRepository
    name: keycloak
  serviceAccountName: app-deployer
  targetNamespace: keycloak-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak-prod
