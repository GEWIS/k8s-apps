apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: room-responsible-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./room-responsible/prod"
  prune: true
  sourceRef:
    kind: GitRepository
    name: room-responsible
  serviceAccountName: app-deployer
  targetNamespace: room-responsible-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: room-responsible-prod
