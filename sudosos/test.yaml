apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sudosos-test
  namespace: flux-system
spec:
  interval: 1m
  path: "./sudosos/overlays/test"
  prune: true
  sourceRef:
    kind: GitRepository
    name: sudosos
  serviceAccountName: app-deployer
  targetNamespace: sudosos-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: sudosos-test
