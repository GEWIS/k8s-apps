apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parelpracht-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./parelpracht/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: parelpracht
  serviceAccountName: app-deployer
  targetNamespace: parelpracht-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: parelpracht-prod
