apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slugshrink-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./slugshrink"
  prune: false # first adoption only, set to true after adoption
  sourceRef:
    kind: GitRepository
    name: slugshrink
  serviceAccountName: app-deployer
  targetNamespace: slugshrink-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: slugshrink-prod
