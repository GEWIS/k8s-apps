apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaneo-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./kaneo"
  prune: true
  sourceRef:
    kind: GitRepository
    name: kaneo
  serviceAccountName: app-deployer
  targetNamespace: kaneo-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: kaneo-prod
