apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signal-prod
  namespace: flux-system
spec:
  interval: 1m
  path: "./signal"
  prune: false # first adoption only, set to true after adoption
  sourceRef:
    kind: GitRepository
    name: signal
  serviceAccountName: app-deployer
  targetNamespace: signal-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: signal-prod
